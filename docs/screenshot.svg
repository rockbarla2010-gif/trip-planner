<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 742" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <rect x="0" y="0" width="940" height="742" rx="10" fill="#0d1117"/>
  <rect x="0" y="0" width="940" height="34" rx="10" fill="#161b22"/>
  <rect x="0" y="24" width="940" height="10" fill="#161b22"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="470" y="21" text-anchor="middle" fill="#8b949e" font-size="12">trip-planner — multi-agent demo</text>

  <g>
    <text x="24" y="66"><tspan fill="#58a6ff">$ </tspan><tspan fill="#c9d1d9">node src/cli.js --demo --to Paris --budget 3500 --travelers 2 --dietary vegan</tspan></text>

    <text x="24" y="110" fill="#7ee787">▶ Planning Paris (2026-09-10 → 2026-09-14) · 2 travelers · budget $3500</text>
    <text x="24" y="132" fill="#6e7681">  mode: deterministic demo pipeline</text>

    <text x="24" y="176" fill="#8b949e">  · orchestrator   attractions → hotel → itinerary → food → flights → budget</text>
    <text x="24" y="198"><tspan fill="#6e7681">  · agent_call  </tspan><tspan fill="#e3b341">[attractions_agent]</tspan><tspan fill="#8b949e">  6 spots; clusters: Montmartre, Le Marais, Champs-Élysées</tspan></text>
    <text x="24" y="220"><tspan fill="#6e7681">  · agent_call  </tspan><tspan fill="#e3b341">[hotel_agent]</tspan><tspan fill="#8b949e">        top = Montmartre Grand Hotel — 0.4km to clusters</tspan></text>
    <text x="24" y="242"><tspan fill="#6e7681">  · agent_call  </tspan><tspan fill="#e3b341">[itinerary_agent]</tspan><tspan fill="#8b949e">    5-day plan anchored at Montmartre</tspan></text>
    <text x="24" y="264"><tspan fill="#6e7681">  · agent_call  </tspan><tspan fill="#e3b341">[food_agent]</tspan><tspan fill="#8b949e">         dining for 5 days</tspan></text>
    <text x="24" y="286"><tspan fill="#6e7681">  · agent_call  </tspan><tspan fill="#e3b341">[flight_agent]</tspan><tspan fill="#8b949e">       cheapest Delta $1005/pp</tspan></text>
    <text x="24" y="308"><tspan fill="#6e7681">  · agent_call  </tspan><tspan fill="#e3b341">[budget_agent]</tspan><tspan fill="#8b949e">       totalled all cost categories</tspan></text>

    <text x="24" y="352" fill="#7ee787" font-size="16" font-weight="bold"># Trip Plan: Paris — 2 travelers · 4 nights</text>

    <text x="24" y="392" fill="#79c0ff" font-weight="bold">## Flights</text>
    <text x="24" y="414"><tspan fill="#c9d1d9">1. Delta — $1005/pp (group $2010), 11h (1 stop)  </tspan><tspan fill="#f0883e">⚠ transit-visa check</tspan></text>
    <text x="24" y="436" fill="#c9d1d9">2. Air France — $1135/pp (group $2270), 9h nonstop</text>

    <text x="24" y="476" fill="#79c0ff" font-weight="bold">## Hotel (recommended)</text>
    <text x="24" y="498" fill="#c9d1d9">Montmartre Grand Hotel — $240/night, Montmartre (0.4km to clusters), rating 4.6</text>

    <text x="24" y="538" fill="#79c0ff" font-weight="bold">## Day 1 — Montmartre</text>
    <text x="24" y="560" fill="#c9d1d9">   morning   Sacré-Cœur &amp; Montmartre (Culture/Views, ~2.5h)</text>
    <text x="24" y="582"><tspan fill="#c9d1d9">   dining    Bouillon Pigalle (Classic French, $)  </tspan><tspan fill="#f0883e">⚠ no confirmed vegan option</tspan></text>

    <text x="24" y="622" fill="#79c0ff" font-weight="bold">## Budget</text>
    <text x="24" y="644" fill="#c9d1d9">   Flights 2010 (52%)  ·  Hotel 960 (25%)  ·  Food 872 (23%)   →  group $3842</text>
    <text x="24" y="666"><tspan fill="#f0883e">   ⚠ Over budget by 9.8%</tspan><tspan fill="#c9d1d9"> — largest driver: Flights → try cheaper flight/dates</tspan></text>

    <text x="24" y="710" fill="#6e7681">Flights · Hotels · Attractions via Amadeus · Restaurants via Google Places · offline stubs by default</text>
  </g>
</svg>
